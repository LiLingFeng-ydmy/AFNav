BASE_TASK_CONFIG_PATH: habitat_extensions/config/zs_vlnce_task.yaml
SIMULATOR_GPU_IDS: [0]
TORCH_GPU_ID: 0
TORCH_GPU_IDS: [0]
GPU_NUMBERS: 1
NUM_ENVIRONMENTS: 1
TENSORBOARD_DIR: data/tensorboard_dirs/
CHECKPOINT_FOLDER: data/checkpoints/
EVAL_CKPT_PATH_DIR: data/checkpoints/
RESULTS_DIR: data/logs/eval_results/
VIDEO_DIR: data/logs/video/
KEYBOARD_CONTROL: 0

SENSORS: ['RGB_SENSOR', 'DEPTH_SENSOR']

MAP:
  VISUALIZE: False
  PRINT_IMAGES: False
  REPVITSAM: 1

EVAL:
  USE_CKPT_CONFIG: False
  SAVE_RESULTS: True
  SPLIT: val_unseen
  MIN_CONSTRAINT_STEPS: 10
  MAX_CONSTRAINT_STEPS: 25
  SCORE_THRESHOLD: 0.5
  VALUE_THRESHOLD: 0.30
  DECISION_THRESHOLD: 0.4
  FMM_WAYPOINT_THRESHOLD: 2.0
  FMM_GOAL_THRESHOLD: 1.0
  CHANGE_THRESHOLD: -0.03
  ENABLE_BACKTRACK: False  
  EXECUTE_SOFT_BACKTRACK: True  

DESTINATION_SEARCH_FRM:
  ENABLED: True                
  DETECTION_MODE: 'immediate'      
  REPEAT_THRESHOLD: 1           
  BASE_RADIUS: 2                
  BASE_PENALTY: 0.7             
  USE_TIME_DECAY: True          
  DECAY_RATE: 0.02              
  MIN_PENALTY: 0.95             
  POSITION_WINDOW: 15
  POSITION_PRECISION: 0.3
  MAX_REGIONS: 15
  MERGE_THRESHOLD_RATIO: 1.2
  OVER_PENALTY_THRESHOLD: 0.03
  USE_OBSTACLE_AWARE: True  
